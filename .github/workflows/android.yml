name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Build APK
        run: |
          ROOT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          cd "$ROOT"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kuberlaxmi-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
